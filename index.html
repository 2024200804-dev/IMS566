<!-- LOGIN PAGE -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
     <link rel="stylesheet" href="style.css">

 </head>
 <body id="varta-bg">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow mx-2 login-card">
            <div class="card-body">

                <div class="text-center mb-4 login-title">

                <img
                src="logo.png"
                class="login-logo"
                alt="Smart Campus Logo">

                <h2>
                Smart Campus
                </h2>

                </div>

                <div class="row">
                    <div class="login-form">

                        <form onsubmit="return login()">

                            <label>Email</label>
                            <input type="email"
                                name="email"
                                class="form-control mb-3"
                                required>

                            <label>Password</label>
                            <input type="password"
                                name="password"
                                class="form-control mb-3"
                                required>

                            <div class="text-end">
                                <button type="submit" class="btn login-btn">
                                    Login
                                </button>
                            </div>

                        </form>

                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- VARTA Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
    VANTA.NET({
    el: "#varta-bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00
    })
    </script>


    <script>

    function login(){

    let email=
    document.querySelector(
    'input[name=email]'
    ).value;

    let password=
    document.querySelector(
    'input[name=password]'
    ).value;


    if(

    email==="admin@smartcampus.com"

    &&

    password==="123456"

    ){

    window.location.href=
    'dashboard.html';

    }

    else{

    alert(
    'Invalid email or password'
    );

    }

    return false;

    }

    </script>

 </body>
 </html>
